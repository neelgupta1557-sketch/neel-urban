<!DOCTYPE html>
<html>
<head>
<title>Neel Urban</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:black;
color:white;
text-align:center;
}

header{
background:linear-gradient(45deg,gold,black);
padding:20px;
font-size:28px;
font-weight:bold;
letter-spacing:2px;
}

nav{
background:#111;
padding:10px;
}

nav a{
color:gold;
margin:10px;
text-decoration:none;
font-weight:bold;
}

.hero{
padding:60px 20px;
}

.hero h1{
color:gold;
font-size:32px;
}

.btn{
background:gold;
color:black;
padding:10px 20px;
border:none;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

.section{
padding:40px 20px;
}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:#111;
border:1px solid gold;
margin:10px;
padding:20px;
width:150px;
border-radius:10px;
}

footer{
background:#111;
padding:20px;
color:gold;
}
</style>
</head>

<body>

<header>
NEEL URBAN
</header>

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Categories</a>
<a href="#">Contact</a>
</nav>

<div class="hero">
<h1>Welcome to Neel Urban</h1>
<p>Premium Streetwear Brand</p>
<button class="btn">Shop Now</button>
</div>

<div class="section">
<h2 style="color:gold;">Categories</h2>
<div class="products">
<div class="card">T-Shirts</div>
<div class="card">Hoodies</div>
<div class="card">Shirts</div>
<div class="card">Jeans</div>
<div class="card">Sneakers</div>
<div class="card">Accessories</div>
</div>
</div>

<footer>
© 2026 Neel Urban | All Rights Reserved
</footer>

</body>
</html>
