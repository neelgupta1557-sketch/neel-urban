<!DOCTYPE html>
<html>
<head>
<title>Neel Urban</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:black;
color:gold;
}

header{
background:#111;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:2px solid gold;
}

/* CATEGORY BAR */
.categories{
display:flex;
overflow-x:auto;
gap:10px;
padding:10px;
background:#000;
}

.categories button{
background:#111;
color:gold;
border:1px solid gold;
padding:6px 12px;
border-radius:20px;
white-space:nowrap;
cursor:pointer;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:#111;
padding:10px;
border-radius:8px;
border:1px solid gold;
position:relative;
}

.image-container{
position:relative;
}

.card img{
width:100%;
border-radius:6px;
}

/* PRICE ON IMAGE */
.price-tag{
position:absolute;
top:8px;
left:8px;
background:gold;
color:black;
padding:3px 8px;
font-size:12px;
font-weight:bold;
border-radius:4px;
}

.title{
font-size:14px;
margin:8px 0;
}

.order-btn{
display:block;
text-align:center;
background:gold;
color:black;
padding:6px;
text-decoration:none;
border-radius:5px;
font-size:13px;
}

footer{
text-align:center;
padding:10px;
background:#111;
border-top:1px solid gold;
font-size:13px;
}
</style>

<script>
function filterCategory(category){
let cards=document.querySelectorAll(".card");
cards.forEach(card=>{
if(category=="all"){
card.style.display="block";
}else{
if(card.classList.contains(category)){
card.style.display="block";
}else{
card.style.display="none";
}
}
});
}
</script>

</head>

<body>

<header>NEEL URBAN</header>

<div class="categories">
<button onclick="filterCategory('all')">All</button>
<button onclick="filterCategory('girls')">Girls</button>
<button onclick="filterCategory('women')">Women</button>
<button onclick="filterCategory('boys')">Boys</button>
<button onclick="filterCategory('mens')">Mens</button>
<button onclick="filterCategory('gift')">Gift</button>
<button onclick="filterCategory('electronics')">Electronics</button>
</div>

<div class="products">

<div class="card girls">
<div class="image-container">
<img src="https://via.placeholder.com/200">
<div class="price-tag">₹499</div>
</div>
<div class="title">Girls Top</div>
<a href="https://wa.me/917080747479?text=I want to order Girls Top ₹499 from Neel Urban" class="order-btn">Order on WhatsApp</a>
</div>

<div class="card women">
<div class="image-container">
<img src="https://via.placeholder.com/200">
<div class="price-tag">₹799</div>
</div>
<div class="title">Women Kurti</div>
<a href="https://wa.me/917080747479?text=I want to order Women Kurti ₹799 from Neel Urban" class="order-btn">Order on WhatsApp</a>
</div>

<div class="card electronics">
<div class="image-container">
<img src="https://via.placeholder.com/200">
<div class="price-tag">₹1299</div>
</div>
<div class="title">Headphones</div>
<a href="https://wa.me/917080747479?text=I want to order Headphones ₹1299 from Neel Urban" class="order-btn">Order on WhatsApp</a>
</div>

</div>

<footer>
© 2026 Neel Urban | WhatsApp: 7080747479
</footer>

</body>
</html>
