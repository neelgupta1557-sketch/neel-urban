<!DOCTYPE html>
<html>
<head>
    <title>Neel Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: gold;
            text-align: center;
        }

        header {
            background: linear-gradient(to right, black, #111);
            color: gold;
            padding: 18px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 2px solid gold;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .box {
            background-color: #111;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid gold;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .box:hover {
            background-color: gold;
            color: black;
            transform: scale(1.05);
            cursor: pointer;
        }

        .shop-btn {
            display: inline-block;
            margin: 25px;
            padding: 14px 30px;
            background-color: gold;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        .shop-btn:hover {
            background-color: #d4af37;
        }

        footer {
            background-color: #111;
            color: gold;
            padding: 12px;
            font-size: 14px;
            border-top: 1px solid gold;
        }

    </style>
</head>

<body>

<header>
    NEEL STORE
</header>

<div class="categories">

    <div class="box">Girls</div>
    <div class="box">Women</div>
    <div class="box">Boys</div>
    <div class="box">Mens</div>
    <div class="box">Gift</div>
    <div class="box">Electronics</div>

</div>

<a href="https://wa.me/917080747479" class="shop-btn">
    Shop Now
</a>

<footer>
    © 2026 Neel Store | All Rights Reserved
</footer>

</body>
</html>
