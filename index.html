<!DOCTYPE html>
<html>
<head>
    <title>Neel Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: black;
            color: white;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
        }

        .box:hover {
            background-color: black;
            color: white;
            cursor: pointer;
        }

        .shop-btn {
            display: inline-block;
            margin: 20px;
            padding: 12px 25px;
            background-color: black;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        footer {
            background-color: black;
            color: white;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    NEEL STORE
</header>

<div class="categories">

    <div class="box">Girls</div>
    <div class="box">Women</div>
    <div class="box">Boys</div>
    <div class="box">Mens</div>
    <div class="box">Gift</div>
    <div class="box">Electronics</div>

</div>

<a href="https://wa.me/917080747479" class="shop-btn">
    Shop Now
</a>

<footer>
    © 2026 Neel Store | All Rights Reserved
</footer>

</body>
</html>
